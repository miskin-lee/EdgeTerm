[package]
name = "edgeterm"
version = "0.3.6"
description = "EdgeTerm - a WindTerm-inspired terminal, SSH, FTP and serial client"
authors = ["EdgeTerm contributors"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "edgeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "fs", "net", "time"] }

# Pure-Rust SSH stack: no libssh2/OpenSSL system dependency, so the app builds
# and cross-compiles anywhere. `ring` replaces the default `aws-lc-rs` backend
# to avoid pulling in a cmake-driven C build.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4"
# Keep the FTP control connection on its dedicated blocking owner thread. This
# 6.2.1 reads legacy LIST output as raw bytes before lossy decoding, which is
# required for FTP servers that expose non-UTF-8 filenames.
suppaftp = "=6.2.1"
encoding_rs = "0.8"

portable-pty = "0.9"
serialport = "4"

parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
dirs = "6"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
