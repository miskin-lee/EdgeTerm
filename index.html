<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdgeTerm</title>
    <script>
      // The palette in styles.css is the dark one until this attribute says
      // otherwise, and the module bundle below runs too late to set it: a
      // deferred script may run after the first paint, so a light-theme user
      // would see a dark page for a frame (issue #35). Reads the same key
      // loadTheme() does in src/store.ts, and the list has to name every
      // ThemeMode in src/types.ts; App.tsx keeps it in step afterwards.
      try {
        var themes = ["dark", "light", "serialx-dark", "serialx-light"];
        var theme = localStorage.getItem("edgeterm.theme");
        if (themes.indexOf(theme) >= 0) {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {
        // No storage: the default palette is the right one.
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
