name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY." >&2
            echo "See the Auto Update section in README.md before publishing." >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD." >&2
            echo "See the Auto Update section in README.md before publishing." >&2
            exit 1
          fi

      - name: Validate and export version
        id: version
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          cargo_version="$(awk -F '"' '/^\[package\]/{in_package=1; next} in_package && /^version = /{print $2; exit}' src-tauri/Cargo.toml)"

          if [[ -z "$app_version" || -z "$cargo_version" ]]; then
            echo "Unable to read the application version." >&2
            exit 1
          fi

          if [[ "$app_version" != "$cargo_version" ]]; then
            echo "Version mismatch: package.json=$app_version, src-tauri/Cargo.toml=$cargo_version" >&2
            echo "Run: npm run version:set -- <major.minor.patch>" >&2
            exit 1
          fi

          tag_name="v${app_version}"

          if git rev-parse --verify --quiet "refs/tags/${tag_name}^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "${tag_name} already points to ${tagged_commit}; bump the application version before releasing ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=EdgeTerm v${app_version}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          release_notes="EdgeTerm v${APP_VERSION}, built from commit [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
          release_notes+=$'\n\nThe application checks this release for signed updates automatically. Download the installer matching your operating system and CPU architecture for a manual installation.'

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "${TAG_NAME} is already published; bump the application version before releasing again." >&2
              exit 1
            fi
            gh release edit "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "$release_notes"
          else
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "$release_notes" \
              --draft
          fi

          release_id="$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            bundle_args: --bundles appimage,deb
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            bundle_args: --bundles appimage,deb
          - name: Windows x64
            platform: windows-2022
            bundle_args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-15
            bundle_args: --bundles app,dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail

          # The x64 hosted image prefers azure.archive.ubuntu.com through a
          # mirror list. If that endpoint accepts a connection but stops
          # responding, apt does not reliably move on to the fallback mirror.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com|d' /etc/apt/apt-mirrors.txt
          fi

          run_apt() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout --signal=TERM --kill-after=15s 10m \
                apt-get \
                  -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 \
                  -o Acquire::ForceIPv4=true \
                  "$@"; then
                return 0
              fi

              if [[ "$attempt" -eq 3 ]]; then
                echo "apt-get failed after ${attempt} attempts." >&2
                return 1
              fi

              echo "apt-get attempt ${attempt} failed; retrying..." >&2
              sleep $((attempt * 5))
            done
          }

          run_apt update
          run_apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Remove stale bundle outputs
        shell: bash
        run: |
          node -e "require('node:fs').rmSync('src-tauri/target/release/bundle', { recursive: true, force: true })"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          releaseBody: EdgeTerm ${{ needs.prepare.outputs.app_version }} signed update.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.bundle_args }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "EdgeTerm-[version]-[platform]-[arch]-[bundle]"

  release:
    name: Verify and publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail

          # Every build job uploads only its own bundles and .sig files, so the
          # updater manifest is assembled here, in a single job, instead of
          # letting parallel jobs race over one shared latest.json asset.
          mkdir -p release-check/signatures

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            > release-check/assets.json

          gh release download "$TAG_NAME" \
            --pattern '*.sig' \
            --dir release-check/signatures \
            --clobber

          updater_targets=(
            "darwin-aarch64=EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "darwin-aarch64-app=EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "windows-x86_64=EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "windows-x86_64-nsis=EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "linux-x86_64=EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "linux-x86_64-appimage=EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "linux-x86_64-deb=EdgeTerm_${APP_VERSION}_amd64.deb"
            "linux-aarch64=EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "linux-aarch64-appimage=EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "linux-aarch64-deb=EdgeTerm_${APP_VERSION}_arm64.deb"
          )

          platforms='{}'
          for target in "${updater_targets[@]}"; do
            platform="${target%%=*}"
            asset_name="${target#*=}"
            signature_file="release-check/signatures/${asset_name}.sig"

            if ! asset_id="$(jq -er --arg name "$asset_name" \
              '.[] | select(.name == $name) | .id' \
              release-check/assets.json)"; then
              echo "Missing release asset for ${platform}: ${asset_name}" >&2
              exit 1
            fi

            if [[ ! -s "$signature_file" ]]; then
              echo "Missing updater signature for ${platform}: ${asset_name}.sig" >&2
              exit 1
            fi

            platforms="$(jq -c \
              --arg platform "$platform" \
              --arg url "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --rawfile signature "$signature_file" \
              '.[$platform] = { url: $url, signature: $signature }' \
              <<< "$platforms")"
          done

          jq -n \
            --arg version "$APP_VERSION" \
            --arg notes "EdgeTerm ${APP_VERSION} signed update." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > release-check/latest.json

          gh release upload "$TAG_NAME" release-check/latest.json --clobber

      - name: Remove unexpected release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "latest.json"
            "EdgeTerm_${APP_VERSION}_aarch64.dmg"
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "EdgeTerm_${APP_VERSION}_amd64.deb"
            "EdgeTerm_${APP_VERSION}_arm64.deb"
          )

          is_expected_asset() {
            local expected
            for expected in "${expected_assets[@]}"; do
              if [[ "$1" == "$expected" ]]; then
                return 0
              fi
            done
            return 1
          }

          # Standalone .sig files are only needed to build latest.json above;
          # the published release embeds the signatures in the manifest.
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > release-check/assets.tsv

          while IFS=$'\t' read -r asset_id asset_name; do
            if ! is_expected_asset "$asset_name"; then
              echo "Deleting unexpected release asset: ${asset_name}"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < release-check/assets.tsv

      - name: Verify release assets and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            > release-check/assets.json

          # Verify the manifest that is actually attached to the release, not
          # the local copy generated above.
          gh release download "$TAG_NAME" \
            --pattern latest.json \
            --dir release-check \
            --clobber

          expected_assets=(
            "latest.json"
            "EdgeTerm_${APP_VERSION}_aarch64.dmg"
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "EdgeTerm_${APP_VERSION}_amd64.deb"
            "EdgeTerm_${APP_VERSION}_arm64.deb"
          )

          if [[ "$(jq 'length' release-check/assets.json)" -ne "${#expected_assets[@]}" ]]; then
            echo "Release does not contain exactly the expected assets:" >&2
            jq -r '.[].name' release-check/assets.json >&2
            exit 1
          fi

          for asset_name in "${expected_assets[@]}"; do
            if ! jq -e --arg asset_name "$asset_name" \
              'any(.[]; .name == $asset_name)' \
              release-check/assets.json >/dev/null; then
              echo "Missing release asset: ${asset_name}" >&2
              exit 1
            fi
          done

          if [[ "$(jq -r '.version' release-check/latest.json)" != "$APP_VERSION" ]]; then
            echo "latest.json version does not match ${APP_VERSION}." >&2
            exit 1
          fi

          expected_url_prefix="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/"

          verify_update() {
            local platform="$1"
            local expected_asset="$2"
            local url
            local asset_id
            local actual_asset

            if ! url="$(jq -er --arg platform "$platform" \
              '.platforms[$platform].url | select(type == "string" and length > 0)' \
              release-check/latest.json)"; then
              echo "latest.json is missing the updater URL for ${platform}." >&2
              exit 1
            fi
            if ! jq -e --arg platform "$platform" \
              '.platforms[$platform].signature | (type == "string") and (length > 0)' \
              release-check/latest.json >/dev/null; then
              echo "latest.json is missing the updater signature for ${platform}." >&2
              exit 1
            fi

            if [[ "$url" != "${expected_url_prefix}"* ]]; then
              echo "Unexpected updater URL for ${platform}: ${url}" >&2
              exit 1
            fi

            asset_id="${url#"$expected_url_prefix"}"
            if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "Invalid updater asset ID for ${platform}: ${asset_id}" >&2
              exit 1
            fi

            if ! actual_asset="$(jq -er --argjson asset_id "$asset_id" \
              '.[] | select(.id == $asset_id) | .name' \
              release-check/assets.json)"; then
              echo "Updater target ${platform} points to asset ${asset_id}, which is not on the release." >&2
              exit 1
            fi
            if [[ "$actual_asset" != "$expected_asset" ]]; then
              echo "Updater target ${platform} points to ${actual_asset}, expected ${expected_asset}." >&2
              exit 1
            fi
          }

          verify_update darwin-aarch64 \
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
          verify_update darwin-aarch64-app \
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
          verify_update windows-x86_64 \
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
          verify_update windows-x86_64-nsis \
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
          verify_update linux-x86_64 \
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
          verify_update linux-x86_64-appimage \
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
          verify_update linux-x86_64-deb \
            "EdgeTerm_${APP_VERSION}_amd64.deb"
          verify_update linux-aarch64 \
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
          verify_update linux-aarch64-appimage \
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
          verify_update linux-aarch64-deb \
            "EdgeTerm_${APP_VERSION}_arm64.deb"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          gh release edit "$TAG_NAME" \
            --draft=false \
            --prerelease=false \
            --latest
