name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY." >&2
            echo "See the Auto Update section in README.md before publishing." >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD." >&2
            echo "See the Auto Update section in README.md before publishing." >&2
            exit 1
          fi

      - name: Validate and export version
        id: version
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          cargo_version="$(awk -F '"' '/^\[package\]/{in_package=1; next} in_package && /^version = /{print $2; exit}' src-tauri/Cargo.toml)"

          if [[ -z "$app_version" || -z "$cargo_version" ]]; then
            echo "Unable to read the application version." >&2
            exit 1
          fi

          if [[ "$app_version" != "$cargo_version" ]]; then
            echo "Version mismatch: package.json=$app_version, src-tauri/Cargo.toml=$cargo_version" >&2
            echo "Run: npm run version:set -- <major.minor.patch>" >&2
            exit 1
          fi

          tag_name="v${app_version}"

          if git rev-parse --verify --quiet "refs/tags/${tag_name}^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "${tag_name} already points to ${tagged_commit}; bump the application version before releasing ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=EdgeTerm v${app_version}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          release_notes="EdgeTerm v${APP_VERSION}, built from commit [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
          release_notes+=$'\n\nThe application checks this release for signed updates automatically. Download the installer matching your operating system and CPU architecture for a manual installation.'

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "${TAG_NAME} is already published; bump the application version before releasing again." >&2
              exit 1
            fi
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes "$release_notes"
          else
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "$release_notes" \
              --draft
          fi

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq .id)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
          - name: Windows x64
            platform: windows-2022
          - name: macOS Intel
            platform: macos-15-intel
          - name: macOS Apple Silicon
            platform: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          releaseBody: EdgeTerm ${{ needs.prepare.outputs.app_version }} signed update.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "EdgeTerm-[version]-[platform]-[arch]-[bundle]"

  release:
    name: Verify and publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          mkdir -p release-check
          gh release download "$TAG_NAME" --pattern latest.json --dir release-check
          expected_url_prefix="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/"

          for platform in \
            linux-x86_64 \
            linux-aarch64 \
            windows-x86_64 \
            darwin-x86_64 \
            darwin-aarch64; do
            jq -e --arg platform "$platform" --arg prefix "$expected_url_prefix" \
              '.platforms[$platform].url as $url | ($url | type == "string") and ($url | startswith($prefix))' \
              release-check/latest.json >/dev/null
            jq -e --arg platform "$platform" \
              '.platforms[$platform].signature as $signature | ($signature | type == "string") and ($signature | length > 0)' \
              release-check/latest.json >/dev/null
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          gh release edit "$TAG_NAME" \
            --draft=false \
            --prerelease=false \
            --latest
